name: Prepare admin release
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv build
      - name: Create review draft with artifact checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --draft --title "keyholder-admin $version" --notes "Independent CLI and Telegram package. Verify SHA256SUMS before installation."
