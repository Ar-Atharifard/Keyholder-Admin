[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "keyholder-admin"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.10"
[project.scripts]
keyholder = "keyholder_admin.cli:main"
keyholder-management-bot = "keyholder_admin.management_bot:main"
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/keyholder_admin"]
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE", "pyproject.toml", "keyholder.1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel.shared-data]
"keyholder.1" = "share/man/man1/keyholder.1"
